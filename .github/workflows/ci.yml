name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The suite deliberately needs no network and no embedding model:
      # every external call (Telegram, model, embeddings) is stubbed in tests.
      # So CI installs only the lightweight runtime dep, not sentence-transformers/torch.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot==22.8

      - name: Run unit tests
        run: python -m unittest discover -s . -p "test_*.py" -t .
